# Runs every API test on pull requests and on main, so a broken test is found
# by CI and not by hand. The tests use fakes for Azure storage and email, so
# they need no secrets, and this workflow has read-only access.
name: API tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-tests.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # Install scripts are off, so a changed package cannot run code here.
      - name: Install API dependencies
        run: npm ci --ignore-scripts --prefix api

      - name: Run every API test
        run: |
          failed=0
          for t in api/tests/*.test.js; do
            echo "::group::$t"
            if node "$t"; then
              echo "passed"
            else
              echo "::error file=$t::$t failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
