# Daily inquiry drafting run.
# SWA managed functions cannot host timer triggers, so this scheduled
# workflow calls the admin drafting endpoint instead. Requires the repo
# secret ODIPA_ADMIN_KEY set to the same value as NEWSLETTER_ADMIN_KEY.
#
# Azure Static Web Apps cuts an API request off after 45 seconds, and each
# draft is a model call, so this drafts a few inquiries per request and repeats
# until none are waiting. Inquiries whose draft fails are skipped for the rest
# of the run. At the end it asks for one reminder email that reports what is
# actually waiting.
name: Daily inquiry drafting

on:
  schedule:
    - cron: '0 16 * * *'   # 16:00 UTC, morning Pacific
  workflow_dispatch: {}

permissions: {}

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Run drafting pass
        env:
          ODIPA_ADMIN_KEY: ${{ secrets.ODIPA_ADMIN_KEY }}
        run: |
          set -euo pipefail
          URL="${DRAFT_URL:-https://www.odipa.org/api/inquiries-draft}"
          post() {
            curl -sS --fail-with-body --max-time 50 -X POST "$URL" \
              -H "x-admin-key: $ODIPA_ADMIN_KEY" -H "Content-Type: application/json" -d "$1"
          }
          skip='[]'; drafted=0; flagged=0; broke=0
          for run in $(seq 1 40); do
            # A failed request (timeout, 500) stops the loop but not the reminder.
            if ! resp=$(post "$(jq -nc --argjson skip "$skip" '{limit: 3, skip: $skip}')"); then
              echo "::warning::Batch $run failed, stopping the drafting pass."
              broke=1; break
            fi
            # A reply that is not the expected JSON stops the loop like a failed request.
            if ! nums=$(jq -re '[(.drafted|numbers), (.flagged|numbers), (.failed|arrays|length), (.remaining|numbers)] | @tsv' <<<"$resp" 2>/dev/null); then
              echo "::warning::Batch $run returned an unexpected reply, stopping the drafting pass."
              broke=1; break
            fi
            read -r d f bad rem <<<"$nums"
            echo "batch $run: $d drafted, $f flagged, $bad failed, $rem remaining"
            drafted=$((drafted + d)); flagged=$((flagged + f))
            skip=$(jq -nc --argjson a "$skip" --argjson b "$(jq '.failed' <<<"$resp")" '$a + $b')
            # Stop when nothing is left, or a whole batch made no progress.
            if [ "$rem" -le 0 ] || [ $((d + f + bad)) -eq 0 ]; then break; fi
          done
          echo "Drafting pass finished: $drafted drafted, $flagged flagged."
          if [ $((drafted + flagged)) -gt 0 ]; then
            if reminder=$(post '{"nudge": true}'); then echo "Reminder: $reminder"; else echo "::warning::The reminder request failed."; fi
          fi
          if [ "$broke" -ne 0 ]; then exit 1; fi
